name: Daten aktualisieren

# Vorberechnete Daten ändern sich selten. Dieser Lauf holt neu hinzugekommene
# Routen, Profile und Klimareihen und öffnet bei Änderungen einen PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *" # monatlich

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run data:build
        env:
          ORS_KEY: ${{ secrets.ORS_KEY }}
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): vorberechnete Daten aktualisiert"
          title: "Vorberechnete Daten aktualisiert"
          branch: chore/refresh-data
          add-paths: data/generated/*.json
