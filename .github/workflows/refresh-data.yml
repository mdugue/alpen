name: Refresh data

# Precomputed data rarely changes. This run fetches newly added routes,
# profiles and climate series and opens a PR if anything changed.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *" # monthly

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run data:build
        env:
          ORS_KEY: ${{ secrets.ORS_KEY }}
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): refresh precomputed data"
          title: "Refresh precomputed data"
          branch: chore/refresh-data
          add-paths: data/generated/*.json
