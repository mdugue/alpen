name: CI

on:
  push:
    branches: [main]
  pull_request:

# The entity pages are prerendered as a sample here (`prerenderParams` in
# lib/data.ts): the full set is the same explorer rendered ~760 times and cost
# five of the seven minutes a run took. The Vercel build prerenders them all.
env:
  PRERENDER_SAMPLE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The package cache and Next's build cache (compiled modules), one entry
      # per job because the two builds differ (the e2e one carries the test
      # hooks); a run on the same lockfile starts from the last one's.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
          key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      # What the next refresh would fetch, on every run: the backlog is drained
      # by a workflow nobody watches, so a pipeline that has stalled is only
      # visible where somebody is already looking. Offline, and never a reason
      # to fail a PR – it reports, it does not judge.
      - run: bun run data:build --status
        continue-on-error: true
      # Last on purpose: the route gate fails this step for as long as the
      # coordinate backlog in rejected.json is unfixed, and a data backlog must
      # not stop CI from checking the code.
      - run: bun run data:check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      # The package cache and Next's build cache (compiled modules), one entry
      # per job because the two builds differ (the e2e one carries the test
      # hooks); a run on the same lockfile starts from the last one's.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
          key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      # The test hook (window.__alpen) only exists in a build with this flag.
      - run: NEXT_PUBLIC_TEST_HOOKS=1 bun run build
      # One timeout for the suite (`e2e:run`), none per scenario: a headless
      # Chrome on a software GL context needs more than the 5 s default.
      - run: bun run e2e:run
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures
          path: e2e/failures
          if-no-files-found: ignore
